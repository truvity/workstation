name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash` -- eight repositories carried that identical block.
  #
  # Deliberately NOT in ci.yaml's recipe list, and deliberately not a
  # required context. A standard-library advisory with no released fix
  # would otherwise wedge every pull request on a finding nobody can act
  # on, which is exactly what happened to pulumi-zitadel.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@7f1a13715dd401c481c565c9923339eb5ef426a4 # v3.27.0
    with:
      recipes: '["vuln"]'
