# Weekly `devbox update`, opened as a PR. Renovate cannot do this job:
# devbox.json and devbox.lock are in its ignorePaths, because the nix
# packages are resolved by devbox, not by a package manager it understands.
name: Devbox Update

on:
  schedule:
    - cron: "0 1 * * 1" # weekly Monday 1am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # client-id + vars.RENOVATE_CLIENT_ID, NOT app-id + secrets.RENOVATE_APP_ID.
      #
      # This is the one line worth reading twice. The org migrated to the
      # client-id form and `RENOVATE_APP_ID` does not exist as an org secret
      # any more — `gh api /orgs/truvity/actions/secrets` lists only
      # RENOVATE_APP_PRIVATE_KEY. With the old form create-github-app-token
      # fails, the job dies before it does anything, and nobody notices,
      # because a workflow that fails on a schedule is invisible unless
      # someone opens the Actions tab.
      #
      # That is not hypothetical: as of 2026-08-16 all eight of the other
      # public repos still carry the old form here, and every one of their
      # weekly runs has failed. This repo is deliberately NOT the ninth.
      # renovate.yaml alongside this file already uses the correct form.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # Checkout with the app token: the default GITHUB_TOKEN is
      # contents:read, so the git push below would get a 403.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Install devbox
        run: curl -fsSL https://get.jetify.com/devbox | bash -s -- -f

      - name: Update devbox packages
        run: devbox update

      - name: Create PR if changes
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          BRANCH="chore/devbox-update-$(date +%Y%m%d)"
          git config user.name "truvity-renovate[bot]"
          git config user.email "truvity-renovate[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add devbox.json devbox.lock
          git commit -m "chore(deps): update devbox packages"
          git push origin "$BRANCH"
          gh pr create --title "chore(deps): update devbox packages" --body "Automated weekly devbox update." --base master --label dependencies
          # Arm auto-merge: merges when required checks pass.
          gh pr merge --auto --rebase "$BRANCH"
